mdp:
  world: "custom"   
  N: 10
  start: [9, 0]
  goal: [[0, 9]]
  slip_prob: 0.1

run:
  solver: "pctl_lp"


pctl:
  p_goal_min: 1.0
  backend: "gurobi"   #  cvxpy | gurobi

  # Define named regions (flags)
  flags:
    - name: "G2"
      region:
        rect: [2, 0, 2, 1]     # row 2, cols 0..1
    - name: "G3"
      region:
        rect: [1, 0, 1, 1]     # row 1, cols 0..1
    - name: "G4"
      region:
        rect: [2, 1, 3, 3]     # rows 2..3, cols 1..3

  # Define Until specs by name
  until_specs:
    - name: "G2U_G3"
      A: "G2"
      B: "G3"

  # Region constraints
  region_constraints: 
  - type: "visit_region_max"
    region: "G4"
    p: 1e-3


  # Until constraints
  until_constraints: 

  - type: "until_min"
    until: "G2U_G3"
    p: 0.5
